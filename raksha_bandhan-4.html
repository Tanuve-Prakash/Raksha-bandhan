<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Raksha Bandhan — Abhishek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight-deep:#060a1e;
    --midnight:#0b1338;
    --midnight-soft:#131c4a;
    --gold:#d9ad4f;
    --gold-bright:#f6d989;
    --gold-glow:#ffe9b0;
    --rose:#f0aecb;
    --rose-deep:#e28aad;
    --ivory:#f7ecd8;
    --emerald:#2fae8b;
    --sapphire:#4a7ff0;
    --violet:#b47ee0;
    --marigold:#f0983c;
    --ruby:#e0577a;
    --teal:#3fc7c0;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse 120% 80% at 50% 20%, var(--midnight-soft) 0%, transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 100%, #0d1a4a 0%, transparent 55%),
      linear-gradient(180deg, var(--midnight-deep) 0%, var(--midnight) 55%, var(--midnight-deep) 100%);
    overflow:hidden;
    font-family:'Cormorant Garamond', serif;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* ---------- aurora color wash ---------- */
  .aurora{position:absolute;inset:-10%;pointer-events:none;z-index:0;overflow:hidden;}
  .aurora span{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.34;
    mix-blend-mode:screen;
    animation:drift var(--adur,22s) ease-in-out infinite;
    animation-delay:var(--adel,0s);
  }
  .aurora span:nth-child(1){width:46vw;height:46vw;top:-8%;left:-6%;background:var(--sapphire);}
  .aurora span:nth-child(2){width:40vw;height:40vw;top:60%;left:70%;background:var(--ruby); animation-direction:reverse;}
  .aurora span:nth-child(3){width:38vw;height:38vw;top:8%;left:66%;background:var(--emerald);}
  .aurora span:nth-child(4){width:34vw;height:34vw;top:72%;left:2%;background:var(--violet); animation-direction:reverse;}
  .aurora span:nth-child(5){width:30vw;height:30vw;top:38%;left:38%;background:var(--marigold); opacity:.18;}
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(4%, -5%) scale(1.15); }
  }

  /* ---------- corner garlands ---------- */
  .garland{position:absolute;top:0;pointer-events:none;z-index:2;opacity:.85;animation:garlandSway 6s ease-in-out infinite;}
  .garland.left{left:0;transform-origin:top left;}
  .garland.right{right:0;transform:scaleX(-1);transform-origin:top right;animation-delay:.6s;}
  @keyframes garlandSway{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(1.2deg);}
  }
  .garland.right{animation-name:garlandSwayR;}
  @keyframes garlandSwayR{
    0%,100%{transform:scaleX(-1) rotate(0deg);}
    50%{transform:scaleX(-1) rotate(1.2deg);}
  }

  /* ---------- ambient particles ---------- */
  .ambient{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .amb-dot{
    position:absolute;
    border-radius:50%;
    background:var(--gold-glow);
    box-shadow:0 0 6px 1px var(--gold-glow);
    opacity:0;
    animation:twinkle var(--dur,6s) ease-in-out infinite;
    animation-delay:var(--del,0s);
  }
  @keyframes twinkle{
    0%,100%{opacity:0; transform:scale(.5);}
    50%{opacity:var(--maxop,.7); transform:scale(1);}
  }
  .amb-dot.flame{
    background:radial-gradient(circle, #ffd98a 0%, #f0983c 55%, transparent 75%);
    box-shadow:0 0 10px 3px rgba(240,152,60,.6);
    animation-name:flicker;
  }
  @keyframes flicker{
    0%,100%{opacity:0; transform:scale(.6);}
    30%{opacity:var(--maxop,.8); transform:scale(1.1);}
    45%{opacity:.4; transform:scale(.85);}
    60%{opacity:var(--maxop,.8); transform:scale(1);}
  }

  /* ---------- rakhi ---------- */
  .rakhi-position{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    transition:transform 1.6s cubic-bezier(.22,.9,.3,1), margin-top 1.6s cubic-bezier(.22,.9,.3,1);
    z-index:5;
  }
  .rakhi-position.lifted{
    transform:translate(-50%,-50%) translateY(-13vh);
  }
  .rakhi-scale{
    opacity:0;
    transform:scale(.25) rotate(-20deg);
    transition:opacity 1.5s cubic-bezier(.2,.7,.25,1), transform 1.5s cubic-bezier(.2,.7,.25,1);
  }
  .rakhi-scale.show{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }
  .rakhi-sway{
    animation:sway 7s ease-in-out infinite;
    animation-play-state:paused;
  }
  .rakhi-sway.spin{animation-play-state:running;}
  @keyframes sway{
    0%,100%{transform:rotate(-6deg);}
    50%{transform:rotate(6deg);}
  }
  .rakhi-glow{
    filter:drop-shadow(0 0 10px rgba(255,222,150,.55)) drop-shadow(0 0 26px rgba(255,200,120,.35));
    animation:pulseGlow 3.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{filter:drop-shadow(0 0 10px rgba(255,222,150,.5)) drop-shadow(0 0 24px rgba(255,200,120,.3));}
    50%{filter:drop-shadow(0 0 18px rgba(255,222,150,.85)) drop-shadow(0 0 42px rgba(255,190,110,.55));}
  }
  .rakhi-svg{
    width:clamp(140px, 34vw, 230px);
    height:auto;
    display:block;
  }

  /* gather ring (petals/sparkles converging on load) */
  .gather-zone{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .gather-item{
    position:absolute;
    top:50%; left:50%;
    opacity:0;
    animation:gather 2.1s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes gather{
    0%{
      opacity:0;
      transform:translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(.4) rotate(0deg);
    }
    18%{ opacity:1; }
    75%{
      opacity:.9;
      transform:translate(calc(-50% + var(--ex)), calc(-50% + var(--ey))) scale(1) rotate(180deg);
    }
    100%{
      opacity:0;
      transform:translate(calc(-50% + var(--ex)), calc(-50% + var(--ey))) scale(.5) rotate(220deg);
    }
  }
  .petal{
    width:14px; height:10px;
    background:linear-gradient(135deg, var(--rose), var(--gold-bright));
    border-radius:70% 30% 70% 30%;
    box-shadow:0 0 8px rgba(240,174,203,.6);
  }
  .spark{
    width:6px; height:6px;
    background:var(--gold-glow);
    border-radius:50%;
    box-shadow:0 0 10px 2px var(--gold-glow);
  }

  /* ---------- halo behind text ---------- */
  .halo{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(85vw, 620px);
    height:min(85vw, 620px);
    background:
      radial-gradient(circle at 50% 50%, rgba(255,222,150,.30) 0%, rgba(255,200,120,.12) 30%, transparent 62%),
      conic-gradient(from 0deg, rgba(240,152,60,.16), rgba(224,87,122,.16), rgba(180,126,224,.16), rgba(74,127,240,.14), rgba(47,174,139,.14), rgba(240,152,60,.16));
    filter:blur(14px);
    opacity:0;
    transition:opacity 2.4s ease;
    animation:haloPulse 5s ease-in-out infinite, haloSpin 26s linear infinite;
    pointer-events:none;
    z-index:3;
  }
  .halo.show{opacity:1;}
  @keyframes haloPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.07);}
  }
  @keyframes haloSpin{
    0%{filter:blur(14px) hue-rotate(0deg);}
    100%{filter:blur(14px) hue-rotate(360deg);}
  }

  /* ---------- text ---------- */
  .text-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, calc(-50% + 15vh));
    text-align:center;
    z-index:6;
    width:90vw;
  }
  .headline{
    font-family:'Playfair Display', serif;
    font-weight:600;
    background:linear-gradient(100deg, var(--gold-bright) 0%, var(--ruby) 22%, var(--gold-glow) 40%, var(--violet) 58%, var(--marigold) 76%, var(--gold-bright) 100%);
    background-size:340% 100%;
    background-position:0% 50%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-size:clamp(1.5rem, 5.6vw, 3.1rem);
    letter-spacing:.55em;
    text-indent:.55em;
    text-transform:uppercase;
    opacity:0;
    filter:blur(14px) drop-shadow(0 0 20px rgba(255,210,150,.45));
    transform:translateY(18px);
    transition:opacity 1.8s cubic-bezier(.2,.7,.3,1), filter 1.8s cubic-bezier(.2,.7,.3,1), transform 1.8s cubic-bezier(.2,.7,.3,1), letter-spacing 2.1s cubic-bezier(.2,.7,.3,1);
  }
  .headline.reveal{
    opacity:1;
    filter:blur(0) drop-shadow(0 0 22px rgba(255,210,150,.5));
    transform:translateY(0);
    letter-spacing:.18em;
    text-indent:.18em;
    animation:shimmer 7s ease-in-out infinite 2.2s;
  }
  @keyframes shimmer{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .subtitle{
    margin-top:clamp(10px,2.4vw,20px);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold-bright);
    font-size:clamp(1.3rem, 4.4vw, 2.1rem);
    letter-spacing:.06em;
    opacity:0;
    filter:blur(10px);
    transform:translateY(14px);
    text-shadow:0 0 16px rgba(255,210,140,.55), 0 0 30px rgba(224,87,122,.35);
    transition:opacity 1.6s cubic-bezier(.2,.7,.3,1) .35s, filter 1.6s cubic-bezier(.2,.7,.3,1) .35s, transform 1.6s cubic-bezier(.2,.7,.3,1) .35s;
  }
  .subtitle.reveal{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }

  /* ---------- falling confetti ---------- */
  .fx-layer{position:absolute; inset:0; pointer-events:none; z-index:4; overflow:hidden;}
  .confetti{
    position:absolute;
    top:-5%;
    width:7px; height:12px;
    opacity:.85;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:.9;}
    100%{ transform:translate(var(--drift), 112vh) rotate(var(--spin)); opacity:0; }
  }
  .heart{
    position:absolute;
    bottom:-4%;
    opacity:0;
    animation:floatUp linear forwards;
  }
  .heart svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px rgba(240,174,203,.7));}
  @keyframes floatUp{
    0%{ transform:translate(0,0) scale(.8); opacity:0; }
    12%{ opacity:.85; }
    100%{ transform:translate(var(--drift), -108vh) scale(1); opacity:0; }
  }

  /* ---------- burst (on button click) ---------- */
  .burst-item{
    position:absolute;
    top:50%; left:50%;
    opacity:0;
    animation:burst 1.7s cubic-bezier(.15,.7,.25,1) forwards;
  }
  @keyframes burst{
    0%{ transform:translate(-50%,-50%) scale(.3) rotate(0deg); opacity:0;}
    12%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(.9) rotate(var(--brot)); opacity:0;}
  }

  /* ---------- button ---------- */
  .celebrate-btn{
    position:absolute;
    bottom:6.5vh;
    left:50%;
    transform:translate(-50%, 14px);
    z-index:10;
    padding:13px 34px;
    background:rgba(217,173,79,.08);
    border:1px solid rgba(217,173,79,.55);
    border-radius:999px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--gold-bright);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.05rem;
    letter-spacing:.08em;
    cursor:pointer;
    opacity:0;
    transition:opacity 1.1s ease, transform 1.1s ease, box-shadow .3s ease, background .3s ease;
    box-shadow:0 0 0px rgba(255,220,150,0);
  }
  .celebrate-btn.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .celebrate-btn:hover{
    background:rgba(217,173,79,.16);
    box-shadow:0 0 26px rgba(255,214,140,.35);
  }
  .celebrate-btn.hidden{
    opacity:0;
    pointer-events:none;
    transform:translate(-50%, 10px);
  }

  @media (max-width:480px){
    .headline{letter-spacing:.4em; text-indent:.4em;}
    .headline.reveal{letter-spacing:.12em; text-indent:.12em;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="aurora"><span></span><span></span><span></span><span></span><span></span></div>

  <svg class="garland left" width="150" height="120" viewBox="0 0 150 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 2 Q 60 70 145 30" stroke="#e9bf6f" stroke-width="1.4" fill="none" opacity="0.75"/>
    <g opacity="0.95">
      <circle cx="14" cy="10" r="5" fill="#f0983c"/>
      <circle cx="38" cy="30" r="5" fill="#e0577a"/>
      <circle cx="60" cy="47" r="5" fill="#f6d989"/>
      <circle cx="82" cy="58" r="5" fill="#b47ee0"/>
      <circle cx="105" cy="46" r="5" fill="#2fae8b"/>
      <circle cx="128" cy="33" r="5" fill="#f0983c"/>
    </g>
  </svg>
  <svg class="garland right" width="150" height="120" viewBox="0 0 150 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 2 Q 60 70 145 30" stroke="#e9bf6f" stroke-width="1.4" fill="none" opacity="0.75"/>
    <g opacity="0.95">
      <circle cx="14" cy="10" r="5" fill="#4a7ff0"/>
      <circle cx="38" cy="30" r="5" fill="#f6d989"/>
      <circle cx="60" cy="47" r="5" fill="#e0577a"/>
      <circle cx="82" cy="58" r="5" fill="#3fc7c0"/>
      <circle cx="105" cy="46" r="5" fill="#f0983c"/>
      <circle cx="128" cy="33" r="5" fill="#b47ee0"/>
    </g>
  </svg>

  <div class="ambient" id="ambient"></div>

  <div class="halo" id="halo"></div>

  <div class="rakhi-position" id="rakhiPos">
    <div class="rakhi-scale" id="rakhiScale">
      <div class="rakhi-sway" id="rakhiSway">
        <div class="rakhi-glow">
          <svg class="rakhi-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="gemGrad" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#fff3d6"/>
                <stop offset="45%" stop-color="#f6cf7a"/>
                <stop offset="100%" stop-color="#c8932f"/>
              </radialGradient>
              <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f3c988"/>
                <stop offset="100%" stop-color="#e79fbe"/>
              </linearGradient>
              <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f6d989"/>
                <stop offset="100%" stop-color="#3fc7c0"/>
              </linearGradient>
              <linearGradient id="petalGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f0aecb"/>
                <stop offset="100%" stop-color="#b47ee0"/>
              </linearGradient>
              <linearGradient id="petalGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f6d989"/>
                <stop offset="100%" stop-color="#f0983c"/>
              </linearGradient>
              <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#c8932f" stop-opacity="0"/>
                <stop offset="15%" stop-color="#e9bf6f" stop-opacity=".9"/>
                <stop offset="50%" stop-color="#f6d989"/>
                <stop offset="85%" stop-color="#e9bf6f" stop-opacity=".9"/>
                <stop offset="100%" stop-color="#c8932f" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- thread -->
            <path d="M -10 100 Q 100 118 210 100" stroke="url(#threadGrad)" stroke-width="2.4" fill="none"/>

            <!-- outer soft glow -->
            <circle cx="100" cy="100" r="66" fill="#f6cf7a" opacity="0.12"/>

            <!-- petals ring -->
            <g>
              <g transform="rotate(0 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad)" opacity="0.92"/></g>
              <g transform="rotate(45 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad2)" opacity="0.92"/></g>
              <g transform="rotate(90 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad3)" opacity="0.92"/></g>
              <g transform="rotate(135 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad4)" opacity="0.92"/></g>
              <g transform="rotate(180 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad)" opacity="0.92"/></g>
              <g transform="rotate(225 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad2)" opacity="0.92"/></g>
              <g transform="rotate(270 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad3)" opacity="0.92"/></g>
              <g transform="rotate(315 100 100)"><ellipse cx="100" cy="46" rx="12" ry="20" fill="url(#petalGrad4)" opacity="0.92"/></g>
            </g>

            <!-- mandala ring -->
            <circle cx="100" cy="100" r="38" fill="none" stroke="#e9bf6f" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.85"/>

            <!-- center gem -->
            <circle cx="100" cy="100" r="24" fill="url(#gemGrad)" stroke="#fff3d6" stroke-width="1"/>
            <circle cx="92" cy="90" r="5" fill="#fff8ea" opacity="0.85"/>
            <g stroke="#fff3d6" stroke-width="1.2" opacity="0.9">
              <line x1="100" y1="88" x2="100" y2="112"/>
              <line x1="88" y1="100" x2="112" y2="100"/>
            </g>

            <!-- hanging strands -->
            <g stroke="#e9bf6f" stroke-width="1.4" opacity="0.9">
              <line x1="88" y1="122" x2="82" y2="148"/>
              <line x1="100" y1="124" x2="100" y2="152"/>
              <line x1="112" y1="122" x2="118" y2="148"/>
            </g>
            <circle cx="82" cy="152" r="4.5" fill="url(#gemGrad)"/>
            <circle cx="100" cy="156" r="5.5" fill="url(#gemGrad)"/>
            <circle cx="118" cy="152" r="4.5" fill="url(#gemGrad)"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="gather-zone" id="gatherZone"></div>
  <div class="fx-layer" id="fxLayer"></div>

  <div class="text-wrap">
    <div class="headline" id="headline">Happy Raksha Bandhan</div>
    <div class="subtitle" id="subtitle">Abhishek ❤️</div>
  </div>

  <button class="celebrate-btn" id="celebrateBtn">✨ Celebrate</button>

</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const ambient = document.getElementById('ambient');
  const halo = document.getElementById('halo');
  const rakhiPos = document.getElementById('rakhiPos');
  const rakhiScale = document.getElementById('rakhiScale');
  const rakhiSway = document.getElementById('rakhiSway');
  const gatherZone = document.getElementById('gatherZone');
  const fxLayer = document.getElementById('fxLayer');
  const headline = document.getElementById('headline');
  const subtitle = document.getElementById('subtitle');
  const btn = document.getElementById('celebrateBtn');

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- ambient twinkling dots ---------- */
  function buildAmbient(count){
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'amb-dot';
      const size = 1 + Math.random()*2.4;
      d.style.width = size+'px';
      d.style.height = size+'px';
      d.style.left = Math.random()*100+'%';
      d.style.top = Math.random()*100+'%';
      d.style.setProperty('--dur', (4+Math.random()*5)+'s');
      d.style.setProperty('--del', (Math.random()*6)+'s');
      d.style.setProperty('--maxop', (0.35+Math.random()*0.5).toFixed(2));
      frag.appendChild(d);
    }
    ambient.appendChild(frag);
  }
  buildAmbient(reduced ? 20 : 55);

  /* ---------- gather effect (petals + sparkles converge on rakhi) ---------- */
  function spawnGather(count){
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      const isPetal = Math.random() < 0.55;
      el.className = 'gather-item ' + (isPetal ? 'petal' : 'spark');
      const angle = Math.random()*Math.PI*2;
      const startR = 42 + Math.random()*38; // vw-ish via px, scaled below
      const sx = Math.cos(angle)*(window.innerWidth*0.32*Math.random()+80);
      const sy = Math.sin(angle)*(window.innerHeight*0.22*Math.random()+60);
      const endAngle = Math.random()*Math.PI*2;
      const endR = 40 + Math.random()*50;
      const ex = Math.cos(endAngle)*endR;
      const ey = Math.sin(endAngle)*endR;
      el.style.setProperty('--sx', sx+'px');
      el.style.setProperty('--sy', sy+'px');
      el.style.setProperty('--ex', ex+'px');
      el.style.setProperty('--ey', ey+'px');
      el.style.animationDelay = (Math.random()*0.6)+'s';
      gatherZone.appendChild(el);
      setTimeout(()=>el.remove(), 3200);
    }
  }

  /* ---------- falling confetti + floating hearts (continuous, gentle) ---------- */
  const confettiColors = ['#e9bf6f','#f6d989','#f0aecb','#e28aad','#fff3d6'];
  function spawnConfetti(){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random()*100+'%';
    el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    el.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    const dur = 9+Math.random()*7;
    el.style.animationDuration = dur+'s';
    el.style.setProperty('--drift', (Math.random()*140-70)+'px');
    el.style.setProperty('--spin', (Math.random()*360+180)+'deg');
    fxLayer.appendChild(el);
    setTimeout(()=>el.remove(), dur*1000+200);
  }

  function heartSVG(color){
    return '<svg viewBox="0 0 32 29"><path d="M16 29 C 6 21, 0 14.5, 0 8.5 C 0 3.5, 4 0, 8.5 0 C 11.8 0, 14.5 1.8, 16 4.6 C 17.5 1.8, 20.2 0, 23.5 0 C 28 0, 32 3.5, 32 8.5 C 32 14.5, 26 21, 16 29 Z" fill="'+color+'"/></svg>';
  }
  function spawnHeart(){
    const el = document.createElement('div');
    el.className = 'heart';
    const size = 10+Math.random()*10;
    el.style.width = size+'px';
    el.style.height = size*0.9+'px';
    el.style.left = (10+Math.random()*80)+'%';
    const color = Math.random() < 0.6 ? '#f0aecb' : '#f6d989';
    el.innerHTML = heartSVG(color);
    const dur = 8+Math.random()*6;
    el.style.animationDuration = dur+'s';
    el.style.setProperty('--drift', (Math.random()*90-45)+'px');
    fxLayer.appendChild(el);
    setTimeout(()=>el.remove(), dur*1000+200);
  }

  let ambientTimer = null;
  function startAmbientFX(){
    if(ambientTimer) return;
    ambientTimer = setInterval(()=>{
      spawnConfetti();
      if(Math.random() < 0.6) spawnHeart();
    }, reduced ? 1400 : 650);
  }

  /* ---------- burst on button click ---------- */
  function spawnBurst(){
    const kinds = ['petal','spark','heartb'];
    const total = reduced ? 24 : 60;
    for(let i=0;i<total;i++){
      const kind = kinds[Math.floor(Math.random()*kinds.length)];
      const el = document.createElement('div');
      const angle = Math.random()*Math.PI*2;
      const dist = 70+Math.random()*(Math.min(window.innerWidth,window.innerHeight)*0.42);
      const bx = Math.cos(angle)*dist;
      const by = Math.sin(angle)*dist;
      el.style.setProperty('--bx', bx+'px');
      el.style.setProperty('--by', by+'px');
      el.style.setProperty('--brot', (Math.random()*720-360)+'deg');
      el.style.animationDelay = (Math.random()*0.25)+'s';

      if(kind === 'petal'){
        el.className = 'burst-item petal';
      } else if(kind === 'spark'){
        el.className = 'burst-item spark';
      } else {
        el.className = 'burst-item';
        el.style.width='14px'; el.style.height='13px';
        el.innerHTML = heartSVG(Math.random()<0.5?'#f0aecb':'#f6d989');
      }
      fxLayer.appendChild(el);
      setTimeout(()=>el.remove(), 2200);
    }
  }

  /* ---------- animation sequence ---------- */
  function playIntro(){
    startAmbientFX();

    setTimeout(()=>{ rakhiScale.classList.add('show'); }, 350);

    setTimeout(()=>{ spawnGather(reduced ? 10 : 26); }, 1500);

    setTimeout(()=>{
      rakhiPos.classList.add('lifted');
      rakhiSway.classList.add('spin');
      halo.classList.add('show');
      headline.classList.add('reveal');
      subtitle.classList.add('reveal');
    }, 3300);

    setTimeout(()=>{ btn.classList.add('show'); }, 4900);
  }

  btn.addEventListener('click', ()=>{
    spawnBurst();
    btn.classList.add('hidden');
    setTimeout(()=>{ btn.style.display='none'; }, 1200);
  });

  window.addEventListener('load', playIntro);
  if(document.readyState === 'complete') playIntro();
})();
</script>

</body>
</html>
